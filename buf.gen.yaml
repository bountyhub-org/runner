version: v2

plugins:
  - local: protoc-gen-go
    out: api
    opt:
      - paths=import
      - module=github.com/bountyhub-org/runner/api
  - local: protoc-gen-connect-go
    out: api
    opt:
      - paths=import
      - module=github.com/bountyhub-org/runner/api
      - package_suffix

managed:
  enabled: true
  override:
    - file_option: go_package
      path: job_assignment_v1.proto
      value: github.com/bountyhub-org/runner/api/jobassignmentv1connect
    - file_option: go_package
      path: job_execution_v1.proto
      value: github.com/bountyhub-org/runner/api/jobexecutionv1connect
    - file_option: go_package
      path: runner_registration_v1.proto
      value: github.com/bountyhub-org/runner/api/runnerregistrationv1connect
